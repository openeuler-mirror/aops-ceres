# 仓库无 pyproject.toml（setup.py 项目），Ruff 使用独立配置文件
target-version = "py39"   # setup.py 未声明 python_requires，按存量兼容默认 py39
line-length = 100

[lint]
# 存量仓库默认只开错误类规则；清理后按路线图分阶段收紧
select = ["E", "F", "I"]
# 中文/全角标点注释仓库：RUF001/002/003 会把「，」等判为模糊字符，属误报；
# 后续把 "RUF" 加回 select 时必须保留这三条 ignore
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
